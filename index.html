<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Flow Screen</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Payment</h1>
    </header>
    <section>

    </section>
    <section class="custom-container main-section">
      <h2>Checkout Summary</h2>
      <div class="d-flex w-100">
          <div id="items"></div>
          <div>Total: <span id="total-price"></span></div>
      </div>
    </section>
    <section class="custom-container main-section d-none">
      <h2>Personal & Contact Info</h2>
      <div>
        <div class="mb-3 w-50">
          <label for="full-name" class="form-label">Full Name</label>
          <input
            type="text"
            class="form-control"
            id="full-name"
            placeholder="e.g. John Doe"
          />
        </div>
        <div class="mb-3 w-50">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="name@example.com"
          />
        </div>
        <div class="mb-3 w-50">
          <label for="phone-number" class="form-label">Phone Number</label>
          <input
            type="text"
            class="form-control"
            id="phone-number"
            placeholder="70 000 000"
          />
        </div>
      </div>
    </section>
    <section class="custom-container main-section d-none">
      <h2>Billing & Shipping Address</h2>
      <div>
        <div class="mb-3 w-50">
          <label for="street-address" class="form-label">Street Address</label>
          <input
            type="text"
            class="form-control"
            id="street-address"
            placeholder=""
          />
        </div>
        <div class="mb-3 w-50">
          <label for="city" class="form-label">City</label>
          <input
            type="text"
            class="form-control"
            id="city"
            placeholder=""
          />
        </div>
        <div class="mb-3 w-50">
          <label for="zip-code" class="form-label">Zip Code</label>
          <input
            type="text"
            class="form-control"
            id="zip-code"
            placeholder=""
          />
        </div>
        <div class="mb-3 w-50">
          <label for="country" class="form-label">Country</label>
          <input
            type="text"
            class="form-control"
            id="country"
            placeholder=""
          />
        </div>
      </div>
    </section>
    <section class="custom-container main-section d-none">
      <h2>Payment Details</h2>
      <div>
        <div class="mb-3 w-50">
          <label for="card-information" class="form-label">Card Information</label>
          <input
            type="text"
            class="form-control"
            id="card-information"
            placeholder=""
          />
        </div>
        <div class="d-flex align-items-center w-50">
            <div class="mb-3 w-50">
          <label for="expiration-date" class="form-label">Expiration Date</label>
          <input
            type="text"
            class="form-control"
            id="expiration-date"
            placeholder=""
          />
        </div>
        <div class="mb-3 w-50">
          <label for="security-code" class="form-label">CVV</label>
          <input
            type="text"
            class="form-control"
            id="security-code"
            placeholder=""
          />
        </div>
        </div>
      </div>
    </section>
    <section class="custom-container main-section d-none">
      <h2>Review & Confirm</h2>

    </section>
    <section class="custom-container main-section d-none">
      <h2 id="confimationResult"></h2>
    </section>
    <section class="custom-container">
      <button class="" id="prev-btn">Previous</button>
      <button id="next-btn">Next</button>
    </section>
    <script src="scripts/main.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
