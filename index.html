<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Flow Screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="stepper-box">
        <div class="stepper-step stepper-active">
          <div class="stepper-circle">
            1
          </div>

          <div class="stepper-content">
            <div class="stepper-title">Checkout Summary</div>
          </div>
        </div>

        <div class="stepper-step stepper-pending">
          <div class="stepper-circle">2</div>
          <div class="stepper-content">
            <div class="stepper-title">Personal & Contact Info</div>
          </div>
        </div>

        <div class="stepper-step stepper-pending">
          <div class="stepper-circle">3</div>

          <div class="stepper-content">
            <div class="stepper-title">Billing & Shipping Address</div>
          </div>
        </div>

        <div class="stepper-step stepper-pending">
          <div class="stepper-circle">4</div>

          <div class="stepper-content">
            <div class="stepper-title">Payment Details</div>
          </div>
        </div>

        <div class="stepper-step stepper-pending">
          <div class="stepper-circle">5</div>
          <div class="stepper-content">
            <div class="stepper-title">Review & Confirm</div>
          </div>
        </div>
        
      </div>
    <main>
      

      <section class="custom-container main-section">
        <h2>Checkout Summary</h2>
        <div class="d-flex justify-content-evenly">
          <div id="items"></div>
          <div>
            <p>Subtotal: <span id="subtotal"></span></p>
            <p>Shipping: <span>$0</span></p>
            <p>Tax: <span>$15</span></p>
            <p>Total: <span id="total-price"></span></p>
          </div>
        </div>
      </section>
      <section class="custom-container main-section d-none">
        <h2>Personal & Contact Info</h2>
        <div
          class="d-flex flex-column justity-content-center align-items-center"
        >
          <div class="mb-3 w-50">
            <label for="full-name" class="form-label">Full Name</label>
            <input
              type="text"
              class="form-control"
              id="full-name"
              placeholder="e.g. John Doe"
            />
          </div>
          <div class="mb-3 w-50">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="name@example.com"
            />
          </div>
          <div class="mb-3 w-50">
            <label for="phone-number" class="form-label">Phone Number</label>
            <input
              type="text"
              class="form-control"
              id="phone-number"
              placeholder="70 000 000"
            />
          </div>
        </div>
      </section>
      <section class="custom-container main-section d-none">
        <h2>Billing & Shipping Address</h2>
        <div
          class="d-flex flex-column justity-content-center align-items-center"
        >
          <div class="mb-3 w-50">
            <label for="street-address" class="form-label"
              >Street Address</label
            >
            <input
              type="text"
              class="form-control"
              id="street-address"
              placeholder=""
            />
          </div>
          <div class="mb-3 w-50">
            <label for="city" class="form-label">City</label>
            <input type="text" class="form-control" id="city" placeholder="" />
          </div>
          <div class="d-flex align-items-center w-50">
            <div class="mb-3 w-50">
              <label for="zip-code" class="form-label">Zip Code</label>
              <input
                type="text"
                class="form-control"
                id="zip-code"
                placeholder=""
              />
            </div>
            <div class="mb-3 w-50">
              <label for="country" class="form-label">Country</label>
              <input
                type="text"
                class="form-control"
                id="country"
                placeholder=""
              />
            </div>
          </div>
        </div>
      </section>
      <section class="custom-container main-section d-none">
        <h2>Payment Details</h2>
        <div
          class="d-flex flex-column justity-content-center align-items-center"
        >
          <div class="mb-3 w-50">
            <label for="card-information" class="form-label"
              >Card Information</label
            >
            <input
              type="text"
              class="form-control"
              id="card-information"
              placeholder=""
            />
          </div>
          <div class="d-flex align-items-center w-50">
            <div class="mb-3 w-50 mr-2">
              <label for="expiration-date" class="form-label"
                >Expiration Date</label
              >
              <input
                type="text"
                class="form-control"
                id="expiration-date"
                placeholder=""
              />
            </div>
            <div class="mb-3 w-50 ml-2">
              <label for="security-code" class="form-label">CVV</label>
              <input
                type="text"
                class="form-control"
                id="security-code"
                placeholder=""
              />
            </div>
          </div>
        </div>
      </section>
      <section class="custom-container main-section d-none">
        <h2>Review & Confirm</h2>
      </section>
      <section class="custom-container main-section d-none">
        <h2 id="confimationResult"></h2>
      </section>
    </main>
    <footer class="custom-container d-flex justify-content-between">
      <button class="d-none nav-btn" id="prev-btn">Previous</button>
      <div></div>
      <button id="next-btn" class="nav-btn">Next</button>
    </footer>
    <script src="scripts/main.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
